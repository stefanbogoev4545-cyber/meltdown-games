<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NERVE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#07080b;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    user-select:none; touch-action:none;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; height:100%; width:min(100vw, 60vh); }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas></div></div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");

  // ---- palette: restrained, one accent. Premium reads as restraint. ----
  var GOLD = "#F5C46B", GREEN = "#5EE6A8", RED = "#FF6B6B";
  var TAU = Math.PI * 2, D2R = Math.PI / 180;

  var W = 0, H = 0, cx = 0, cy = 0, R = 0, ring = 0;

  function resize() {
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.44;
    R = Math.min(W * 0.36, H * 0.23);
    ring = Math.max(9, R * 0.13);
  }

  // ---- payout ladder. Shown to the player at all times: that's the hook. ----
  var LADDER = [1.2, 1.5, 2, 3, 4, 6, 8, 12, 16, 25, 40, 60, 100, 150, 220, 320, 500];
  var STAKE = 100;

  function multAt(step) {
    if (step < 0) return 0;
    if (step < LADDER.length) return LADDER[step];
    return LADDER[LADDER.length - 1] * Math.pow(1.5, step - LADDER.length + 1);
  }
  function potAt(step) { return Math.round(STAKE * multAt(step)); }

  function arcFor(step) { return Math.max(6, 52 * Math.pow(0.87, step)) * D2R; }
  function speedFor(step) { return Math.min(560, 120 * Math.pow(1.09, step)) * D2R; }

  // ---- state ----
  var TITLE = 0, SPIN = 1, BUST = 2, BANKED = 3;
  var state = TITLE;

  var step = -1;             // hits landed this round
  var ptr = 0, dir = 1, spd = 0;
  var targetC = 0, targetArc = 0;
  var trail = [];

  var total = 0;             // banked this session
  var bestBank = 0, deepest = 0;

  var shake = 0, flash = 0, hitPulse = 0;
  var missAngle = 0, missBy = 0;   // for the near-miss readout
  var bankedAmt = 0, bankTimer = 0;
  var toast = null;

  function load() {
    try {
      bestBank = parseInt(localStorage.getItem("nerve_best") || "0", 10) || 0;
      deepest  = parseInt(localStorage.getItem("nerve_deep") || "0", 10) || 0;
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem("nerve_best", String(bestBank));
      localStorage.setItem("nerve_deep", String(deepest));
    } catch (e) {}
  }

  function fmt(n) { return n.toLocaleString("en-US"); }
  function multStr(m) { return (m >= 100 ? Math.round(m) : m.toFixed(m < 10 ? 1 : 0)) + "x"; }

  // ---- angles ----
  function norm(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }

  function newTarget() {
    targetArc = arcFor(step + 1);
    spd = speedFor(step + 1);
    // Place the target away from the pointer so there's always reaction time.
    var offset = (0.45 + Math.random() * 0.9) * Math.PI;
    targetC = ptr + dir * offset;
    // Direction can flip between rounds — visible immediately, so it stays fair.
    if (step >= 2 && Math.random() < 0.35) { dir *= -1; targetC = ptr + dir * offset; }
  }

  function newRound() {
    step = -1; trail.length = 0;
    ptr = Math.random() * TAU;
    dir = Math.random() < 0.5 ? 1 : -1;
    newTarget();
    state = SPIN;
  }

  // ---- audio ----
  var actx = null;
  function initAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol, delay) {
    if (!actx) return;
    try {
      var t0 = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol == null ? 0.08 : vol, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }

  // ---- cash-out button geometry (shared by draw + hit-test) ----
  function btn() {
    var w = Math.min(W * 0.78, 340), h = Math.max(52, H * 0.075);
    return { x: (W - w) / 2, y: H * 0.845 - h / 2, w: w, h: h };
  }
  function inBtn(x, y) {
    var b = btn();
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  }

  // ---- actions ----
  function stopPointer() {
    if (state !== SPIN) return;
    var d = norm(ptr - targetC);
    var half = targetArc / 2;

    if (Math.abs(d) <= half) {
      step++;
      if (step + 1 > deepest) { deepest = step + 1; save(); }
      hitPulse = 1; flash = 0.5; shake = Math.min(8, 2 + step * 0.45);
      tone(420 + Math.min(step, 18) * 42, 0.12, "triangle", 0.09);
      tone(840 + Math.min(step, 18) * 84, 0.09, "sine", 0.04, 0.02);
      newTarget();
    } else {
      missBy = Math.round((Math.abs(d) - half) / D2R);
      missAngle = ptr;
      state = BUST;
      shake = 14;
      tone(150, 0.3, "sawtooth", 0.09);
      tone(92, 0.45, "sawtooth", 0.07, 0.08);
    }
  }

  function cashOut() {
    if (state !== SPIN || step < 0) return;
    bankedAmt = potAt(step);
    total += bankedAmt;
    if (bankedAmt > bestBank) { bestBank = bankedAmt; save(); }
    bankTimer = 1.35;
    state = BANKED;
    flash = 0.7;
    tone(523, 0.16, "triangle", 0.08);
    tone(659, 0.16, "triangle", 0.08, 0.07);
    tone(784, 0.26, "triangle", 0.08, 0.14);
  }

  function tap(x, y) {
    initAudio();
    if (state === TITLE) { newRound(); return; }
    if (state === BUST)  { newRound(); return; }
    if (state === BANKED) { bankTimer = 0; newRound(); return; }
    if (state === SPIN) {
      if (step >= 0 && inBtn(x, y)) cashOut();
      else stopPointer();
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    tap(e.clientX - r.left, e.clientY - r.top);
  });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); initAudio();
      if (state === SPIN) stopPointer(); else tap(-1, -1); }
    else if (e.code === "Enter" || e.code === "KeyC") { e.preventDefault(); initAudio(); cashOut(); }
  });

  // ---- update ----
  function update(dt) {
    if (state === SPIN) {
      ptr += dir * spd * dt;
      trail.push(ptr);
      if (trail.length > 14) trail.shift();
    }
    if (state === BANKED) {
      bankTimer -= dt;
      if (bankTimer <= 0) newRound();
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
    if (hitPulse > 0) hitPulse = Math.max(0, hitPulse - dt * 2.6);
    if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
  }

  // ---- render ----
  function arcPath(a0, a1, rad, width, color, cap) {
    ctx.beginPath();
    ctx.arc(cx, cy, rad, a0, a1);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.lineCap = cap || "butt";
    ctx.stroke();
  }

  function render() {
    ctx.fillStyle = "#07080b";
    ctx.fillRect(0, 0, W, H);

    // soft vignette glow behind the dial
    var g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 2.4);
    g.addColorStop(0, "rgba(245,196,107,.055)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.07) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    drawDial();
    ctx.restore();

    drawHUD();
  }

  function drawDial() {
    // base ring
    arcPath(0, TAU, R, ring, "rgba(255,255,255,.06)");
    arcPath(0, TAU, R, 1, "rgba(255,255,255,.10)");

    if (state === SPIN || state === BUST) {
      // target zone
      var col = state === BUST ? "rgba(255,107,107,.9)" : GOLD;
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 18;
      arcPath(targetC - targetArc / 2, targetC + targetArc / 2, R, ring, col, "round");
      ctx.restore();

      // pointer trail
      for (var i = 0; i < trail.length; i++) {
        var a = trail[i], al = (i / trail.length) * 0.35;
        ctx.globalAlpha = al;
        arcPath(a - 0.02, a + 0.02, R, ring * 0.62, "#fff", "round");
      }
      ctx.globalAlpha = 1;

      // pointer
      var pa = state === BUST ? missAngle : ptr;
      ctx.save();
      ctx.shadowColor = "#fff"; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(pa) * (R - ring * 0.95), cy + Math.sin(pa) * (R - ring * 0.95));
      ctx.lineTo(cx + Math.cos(pa) * (R + ring * 0.95), cy + Math.sin(pa) * (R + ring * 0.95));
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = state === BUST ? RED : "#fff";
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.restore();
    }

    // centre readout
    ctx.textAlign = "center";
    if (state === SPIN || state === BANKED) {
      var pot = step >= 0 ? potAt(step) : 0;
      var pulse = 1 + hitPulse * 0.10;

      ctx.fillStyle = "rgba(255,255,255,.34)";
      ctx.font = "700 " + Math.round(H * 0.017) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("POT", cx, cy - R * 0.30);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = step >= 0 ? "#fff" : "rgba(255,255,255,.28)";
      ctx.font = "800 " + Math.round(H * 0.062) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(fmt(pot), 0, R * 0.02);
      ctx.restore();

      if (step >= 0) {
        ctx.fillStyle = GOLD;
        ctx.font = "800 " + Math.round(H * 0.024) + "px Segoe UI, system-ui, sans-serif";
        ctx.fillText(multStr(multAt(step)), cx, cy + R * 0.30);
      }
    }

    if (state === BUST) {
      ctx.textAlign = "center";
      ctx.fillStyle = RED;
      ctx.font = "800 " + Math.round(H * 0.046) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("BUST", cx, cy + R * 0.02);
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.font = "700 " + Math.round(H * 0.02) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("missed by " + missBy + "°", cx, cy + R * 0.30);
    }
  }

  function drawHUD() {
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.font = "700 " + Math.round(H * 0.0155) + "px Segoe UI, system-ui, sans-serif";
    ctx.fillText("BANKED", W * 0.07, H * 0.062);
    ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
    ctx.fillText(fmt(total), W * 0.07, H * 0.093);

    ctx.textAlign = "right";
    ctx.fillStyle = "rgba(255,255,255,.30)";
    ctx.font = "700 " + Math.round(H * 0.0155) + "px Segoe UI, system-ui, sans-serif";
    ctx.fillText("BEST RUN", W * 0.93, H * 0.062);
    ctx.fillStyle = GOLD;
    ctx.font = "800 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
    ctx.fillText(fmt(bestBank), W * 0.93, H * 0.093);

    ctx.textAlign = "center";

    if (state === TITLE) {
      ctx.fillStyle = "#fff";
      ctx.font = "900 " + Math.round(H * 0.075) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("NERVE", cx, H * 0.70);
      ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.font = "600 " + Math.round(H * 0.021) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("Stop the line in the gold. Every hit multiplies.", cx, H * 0.745);
      ctx.fillText("Miss once and you lose it all.", cx, H * 0.775);
      ctx.fillStyle = GOLD;
      ctx.font = "800 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("TAP TO PLAY", cx, H * 0.855);
      return;
    }

    // The temptation line — what you hold vs. what one more hit pays.
    if (state === SPIN) {
      var nextPot = potAt(step + 1);
      ctx.fillStyle = "rgba(255,255,255,.34)";
      ctx.font = "700 " + Math.round(H * 0.019) + "px Segoe UI, system-ui, sans-serif";
      if (step >= 0) {
        ctx.fillText("one more pays " + fmt(nextPot) + "   •   " + multStr(multAt(step + 1)), cx, H * 0.73);
      } else {
        ctx.fillText("first hit pays " + fmt(nextPot), cx, H * 0.73);
      }

      var b = btn();
      var live = step >= 0;
      ctx.globalAlpha = live ? 1 : 0.22;
      ctx.beginPath();
      var rr = b.h / 2;
      ctx.moveTo(b.x + rr, b.y);
      ctx.arcTo(b.x + b.w, b.y, b.x + b.w, b.y + b.h, rr);
      ctx.arcTo(b.x + b.w, b.y + b.h, b.x, b.y + b.h, rr);
      ctx.arcTo(b.x, b.y + b.h, b.x, b.y, rr);
      ctx.arcTo(b.x, b.y, b.x + b.w, b.y, rr);
      ctx.closePath();
      ctx.fillStyle = live ? GREEN : "rgba(255,255,255,.12)";
      ctx.fill();
      ctx.fillStyle = live ? "#06231a" : "rgba(255,255,255,.5)";
      ctx.font = "800 " + Math.round(H * 0.024) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(live ? "CASH OUT  " + fmt(potAt(step)) : "CASH OUT", cx, b.y + b.h / 2 + H * 0.0085);
      ctx.globalAlpha = 1;
      return;
    }

    if (state === BUST) {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.font = "700 " + Math.round(H * 0.022) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("you dropped " + fmt(potAt(step)), cx, H * 0.73);
      ctx.fillStyle = GOLD;
      ctx.font = "800 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("TAP TO GO AGAIN", cx, H * 0.855);
      return;
    }

    if (state === BANKED) {
      ctx.fillStyle = GREEN;
      ctx.font = "900 " + Math.round(H * 0.042) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("+" + fmt(bankedAmt), cx, H * 0.73);
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.font = "700 " + Math.round(H * 0.02) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("BANKED", cx, H * 0.765);
    }
  }

  var last = 0;
  function frame(t) {
    if (!last) last = t;
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", function () { resize(); });

  load();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
