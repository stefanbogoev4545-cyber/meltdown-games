<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LOCKED IN — Stack Tower</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#07080f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select:none; touch-action:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #stage {
    position:relative;
    height:100%;
    width:min(100vw, 62vh);
    box-shadow:0 0 80px rgba(0,0,0,.9);
  }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c"></canvas></div></div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");

  var W = 0, H = 0;           // logical (CSS px) play area
  var blockH = 0, baseWidth = 0, baseY = 0, perfectTol = 0, minWidth = 0;

  function resize() {
    var r = stage.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    blockH     = H / 18;
    baseWidth  = W * 0.62;
    baseY      = H * 0.86;      // bottom edge of the very first block
    perfectTol = Math.max(2.2, W * 0.013);
    minWidth   = W * 0.045;
  }

  // ---------------------------------------------------------------- state
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_TITLE;

  var tower = [];       // { x, w, idx, hue }
  var falling = [];     // sliced-off chunks tumbling away
  var particles = [];
  var cur = null;       // the moving block
  var score = 0, combo = 0, best = 0;
  var camY = 0, camTarget = 0;
  var shake = 0;
  var hype = null;      // { text, life }
  var flash = 0;

  var HYPE = [
    { at: 2,  text: "NICE" },
    { at: 3,  text: "LOCKED IN" },
    { at: 5,  text: "COOKING" },
    { at: 7,  text: "HE'S HIM" },
    { at: 10, text: "CERTIFIED" },
    { at: 14, text: "UNREAL" },
    { at: 20, text: "ASCENDED" }
  ];

  function loadBest() {
    try { best = parseInt(localStorage.getItem("lis_best") || "0", 10) || 0; }
    catch (e) { best = 0; }
  }
  function saveBest() {
    try { localStorage.setItem("lis_best", String(best)); } catch (e) {}
  }

  function hueFor(i) { return (196 + i * 6) % 360; }

  function reset() {
    tower.length = 0;
    falling.length = 0;
    particles.length = 0;
    score = 0; combo = 0;
    camY = 0; camTarget = 0;
    shake = 0; hype = null; flash = 0;

    tower.push({ x: (W - baseWidth) / 2, w: baseWidth, idx: 0, hue: hueFor(0) });
    spawn();
  }

  function spawn() {
    var top = tower[tower.length - 1];
    var i = tower.length;
    var speed = Math.min(W * 0.95, W * 0.42 + i * W * 0.016);
    var fromLeft = i % 2 === 0;
    cur = {
      x: fromLeft ? -top.w : W,
      w: top.w,
      idx: i,
      hue: hueFor(i),
      vx: fromLeft ? speed : -speed
    };
  }

  // ---------------------------------------------------------------- audio
  var actx = null;
  function blip(freq, dur, type, vol) {
    if (!actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol == null ? 0.09 : vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function initAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) { actx = null; }
  }

  // ---------------------------------------------------------------- input
  function drop() {
    if (state === STATE_TITLE) { state = STATE_PLAY; reset(); return; }
    if (state === STATE_OVER)  { state = STATE_PLAY; reset(); return; }

    var top = tower[tower.length - 1];
    var left  = Math.max(cur.x, top.x);
    var right = Math.min(cur.x + cur.w, top.x + top.w);
    var overlap = right - left;

    // Missed the tower entirely — the block tumbles away and the run ends.
    if (overlap <= 0) {
      falling.push({
        x: cur.x, w: cur.w, y: baseY - cur.idx * blockH,
        vx: cur.vx > 0 ? 140 : -140, vy: -60, rot: 0,
        vr: (cur.vx > 0 ? 1 : -1) * 3, hue: cur.hue, life: 2.2
      });
      gameOver();
      return;
    }

    var delta = cur.x - top.x;
    var placed;

    if (Math.abs(delta) <= perfectTol) {
      // Perfect: keep the full width, and slowly regrow once on a streak.
      combo++;
      var grow = combo >= 2 ? Math.min(baseWidth - top.w, W * 0.014) : 0;
      var nw = top.w + grow;
      placed = { x: top.x - grow / 2, w: nw, idx: cur.idx, hue: cur.hue };
      burst(placed.x + nw / 2, baseY - cur.idx * blockH - blockH / 2, cur.hue);
      shake = Math.min(9, 3 + combo * 0.6);
      flash = 0.35;
      blip(560 + Math.min(combo, 12) * 55, 0.11, "square", 0.10);
      for (var h = HYPE.length - 1; h >= 0; h--) {
        if (combo >= HYPE[h].at) { hype = { text: HYPE[h].text, life: 1.0 }; break; }
      }
    } else {
      // Sliced: the overhang breaks off and falls.
      combo = 0;
      placed = { x: left, w: overlap, idx: cur.idx, hue: cur.hue };
      var sliceX = delta > 0 ? right : cur.x;
      var sliceW = Math.abs(delta);
      falling.push({
        x: sliceX, w: sliceW, y: baseY - cur.idx * blockH,
        vx: (delta > 0 ? 1 : -1) * 90, vy: -40, rot: 0,
        vr: (delta > 0 ? 1 : -1) * 2.4, hue: cur.hue, life: 2.0
      });
      blip(220, 0.07, "sine", 0.07);
    }

    tower.push(placed);
    score++;

    if (placed.w < minWidth) { gameOver(); return; }
    spawn();
  }

  function gameOver() {
    state = STATE_OVER;
    cur = null;
    shake = 12;
    if (score > best) { best = score; saveBest(); }
    blip(150, 0.28, "sawtooth", 0.08);
    setTimeout(function () { blip(95, 0.4, "sawtooth", 0.07); }, 90);
  }

  function burst(x, y, hue) {
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 190;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        s: 2 + Math.random() * 4, life: 0.5 + Math.random() * 0.4, hue: hue
      });
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault(); initAudio(); drop();
  });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowDown") {
      e.preventDefault(); initAudio(); drop();
    }
  });

  // ---------------------------------------------------------------- update
  function update(dt) {
    // Camera trails the top of the tower.
    var topIdx = tower.length ? tower[tower.length - 1].idx : 0;
    camTarget = Math.max(0, topIdx * blockH - H * 0.36);
    camY += (camTarget - camY) * Math.min(1, dt * 7);

    if (state === STATE_PLAY && cur) {
      cur.x += cur.vx * dt;
      if (cur.vx > 0 && cur.x + cur.w >= W) { cur.x = W - cur.w; cur.vx *= -1; }
      else if (cur.vx < 0 && cur.x <= 0)     { cur.x = 0;         cur.vx *= -1; }
    }

    for (var i = falling.length - 1; i >= 0; i--) {
      var f = falling[i];
      f.vy += 1500 * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.rot += f.vr * dt;
      f.life -= dt;
      if (f.life <= 0) falling.splice(i, 1);
    }

    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.vy += 900 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 34);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
    if (hype) { hype.life -= dt; if (hype.life <= 0) hype = null; }
  }

  // ---------------------------------------------------------------- render
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBlock(x, screenY, w, hue, alpha) {
    // screenY is the BOTTOM edge; blocks are drawn upward from there.
    var y = screenY - blockH;
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    var g = ctx.createLinearGradient(x, y, x + w, y + blockH);
    g.addColorStop(0, "hsl(" + hue + ",78%,62%)");
    g.addColorStop(1, "hsl(" + ((hue + 34) % 360) + ",76%,46%)");
    ctx.fillStyle = g;
    roundRect(x, y, w, blockH - 2, Math.min(6, blockH * 0.2));
    ctx.fill();
    // top highlight for depth
    ctx.fillStyle = "rgba(255,255,255,.20)";
    roundRect(x, y, w, Math.max(2, blockH * 0.22), Math.min(6, blockH * 0.2));
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    ctx.scale(dpr, dpr);

    // Background shifts hue as the tower climbs — reads well in clips.
    var bh = (208 + score * 2.2) % 360;
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "hsl(" + bh + ",42%,13%)");
    bg.addColorStop(1, "hsl(" + ((bh + 40) % 360) + ",48%,5%)");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.16) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Tower (only what's on screen).
    for (var i = 0; i < tower.length; i++) {
      var b = tower[i];
      var sy = baseY - b.idx * blockH + camY;
      if (sy < -blockH * 2 || sy > H + blockH * 2) continue;
      drawBlock(b.x, sy, b.w, b.hue);
    }

    // Tumbling slices.
    for (var k = 0; k < falling.length; k++) {
      var f = falling[k];
      var fy = f.y + camY;
      if (fy > H + 200) continue;
      ctx.save();
      ctx.translate(f.x + f.w / 2, fy - blockH / 2);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.fillStyle = "hsl(" + f.hue + ",74%,56%)";
      roundRect(-f.w / 2, -blockH / 2, f.w, blockH - 2, 3);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // The moving block.
    if (state === STATE_PLAY && cur) {
      drawBlock(cur.x, baseY - cur.idx * blockH + camY, cur.w, cur.hue);
    }

    // Particles.
    for (var p2 = 0; p2 < particles.length; p2++) {
      var p = particles[p2];
      ctx.globalAlpha = Math.max(0, p.life * 1.8);
      ctx.fillStyle = "hsl(" + p.hue + ",90%,72%)";
      ctx.fillRect(p.x, p.y + camY, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHUD();
  }

  function drawHUD() {
    ctx.textAlign = "center";

    if (state === STATE_PLAY) {
      ctx.fillStyle = "#fff";
      ctx.font = "800 " + Math.round(H * 0.085) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(String(score), W / 2, H * 0.135);

      if (combo >= 2) {
        ctx.fillStyle = "hsl(" + ((44 + combo * 7) % 360) + ",100%,64%)";
        ctx.font = "800 " + Math.round(H * 0.028) + "px Segoe UI, system-ui, sans-serif";
        ctx.fillText("x" + combo + " PERFECT", W / 2, H * 0.175);
      }

      if (hype) {
        ctx.globalAlpha = Math.min(1, hype.life * 1.6);
        ctx.fillStyle = "#fff";
        ctx.font = "900 " + Math.round(H * 0.05) + "px Segoe UI, system-ui, sans-serif";
        ctx.fillText(hype.text, W / 2, H * 0.30 - (1 - hype.life) * 22);
        ctx.globalAlpha = 1;
      }
    }

    if (state === STATE_TITLE) {
      ctx.fillStyle = "#fff";
      ctx.font = "900 " + Math.round(H * 0.072) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("LOCKED IN", W / 2, H * 0.40);
      ctx.fillStyle = "rgba(255,255,255,.62)";
      ctx.font = "600 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("Stack the tower. Don't miss.", W / 2, H * 0.46);
      ctx.fillStyle = "hsl(48,100%,64%)";
      ctx.font = "800 " + Math.round(H * 0.032) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("TAP TO START", W / 2, H * 0.58);
      if (best > 0) {
        ctx.fillStyle = "rgba(255,255,255,.45)";
        ctx.font = "600 " + Math.round(H * 0.024) + "px Segoe UI, system-ui, sans-serif";
        ctx.fillText("BEST  " + best, W / 2, H * 0.66);
      }
    }

    if (state === STATE_OVER) {
      ctx.fillStyle = "rgba(4,5,12,.74)";
      ctx.fillRect(0, 0, W, H);

      var isBest = score >= best && score > 0;
      ctx.fillStyle = isBest ? "hsl(48,100%,64%)" : "#fff";
      ctx.font = "900 " + Math.round(H * 0.05) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(isBest ? "NEW BEST" : "RUN OVER", W / 2, H * 0.36);

      ctx.fillStyle = "#fff";
      ctx.font = "900 " + Math.round(H * 0.13) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText(String(score), W / 2, H * 0.50);

      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.font = "600 " + Math.round(H * 0.026) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("BEST  " + best, W / 2, H * 0.565);

      ctx.fillStyle = "hsl(48,100%,64%)";
      ctx.font = "800 " + Math.round(H * 0.032) + "px Segoe UI, system-ui, sans-serif";
      ctx.fillText("TAP TO RETRY", W / 2, H * 0.68);
    }
  }

  // ---------------------------------------------------------------- loop
  var last = 0;
  function frame(t) {
    if (!last) last = t;
    var dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", function () {
    var prevScore = score, prevState = state;
    resize();
    // Rebuild geometry cleanly on orientation change rather than distorting it.
    if (prevState === STATE_PLAY) { state = STATE_TITLE; score = prevScore; }
  });

  loadBest();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
